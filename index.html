<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>초등 필수 영단어 800</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4CAF50">

<link rel="apple-touch-icon" href="icons/icon-192.png">

</head>


<body>


<header>

<h1>📚 초등 필수 영단어 800</h1>

<div class="stats">

<div>
오늘 목표
<br>
<span id="todayGoal">미설정</span>
</div>

<div>
연속 학습
<br>
<span id="streak">0일</span>
</div>

<div>
진행률
<br>
<span id="progressText">0 / 800</span>
</div>

</div>


<div class="progress">

<div id="progressBar"></div>

</div>


</header>





<nav>

<button data-page="home">
📖 단어
</button>

<button data-page="quiz">
🎮 퀴즈
</button>

<button data-page="wrongPage">
📝 오답노트
</button>

</nav>





<!-- =========================
     단어 페이지
========================= -->


<section id="home" class="page">


<div class="menu">


<input 
id="search"
placeholder="단어 검색">

<br>


<button id="showAll">
전체보기
</button>

<button id="showLearned">
외운 단어
</button>

<button id="showUnlearned">
안 외운 단어
</button>


</div>



<div class="alphabet">


<button class="filter active" data-letter="ALL">
전체
</button>


<button class="filter" data-letter="A">A</button>
<button class="filter" data-letter="B">B</button>
<button class="filter" data-letter="C">C</button>
<button class="filter" data-letter="D">D</button>
<button class="filter" data-letter="E">E</button>
<button class="filter" data-letter="F">F</button>
<button class="filter" data-letter="G">G</button>
<button class="filter" data-letter="H">H</button>
<button class="filter" data-letter="I">I</button>
<button class="filter" data-letter="J">J</button>
<button class="filter" data-letter="K">K</button>
<button class="filter" data-letter="L">L</button>
<button class="filter" data-letter="M">M</button>
<button class="filter" data-letter="N">N</button>
<button class="filter" data-letter="O">O</button>
<button class="filter" data-letter="P">P</button>
<button class="filter" data-letter="Q">Q</button>
<button class="filter" data-letter="R">R</button>
<button class="filter" data-letter="S">S</button>
<button class="filter" data-letter="T">T</button>
<button class="filter" data-letter="U">U</button>
<button class="filter" data-letter="V">V</button>
<button class="filter" data-letter="W">W</button>
<button class="filter" data-letter="X">X</button>
<button class="filter" data-letter="Y">Y</button>
<button class="filter" data-letter="Z">Z</button>


</div>



<div id="wordList">

</div>


</section>





<!-- =========================
     퀴즈 페이지
========================= -->


<section id="quiz" class="page hidden">


<h2>
🎮 영어 퀴즈
</h2>



<div class="quizMenu">


<button 
data-type="meaning"
class="active">

영어 → 뜻

</button>


<button 
data-type="word">

뜻 → 영어

</button>


<button 
data-type="listen">

듣기

</button>


<button 
data-type="spelling">

철자

</button>


</div>




<div class="range">


<label>

<input 
type="radio"
name="range"
value="all"
checked>

전체 단어

</label>


<label>

<input 
type="radio"
name="range"
value="learned">

외운 단어

</label>


<label>

<input 
type="radio"
name="range"
value="unlearned">

안 외운 단어

</label>


<label>

<input 
type="radio"
name="range"
value="wrong">

오답

</label>


</div>




<div>

문제 수

<input 
id="quizCount"
type="number"
value="10"
min="1"
max="100">

</div>



<br>


<button id="startQuiz">

퀴즈 시작

</button>



<div id="quizArea">

</div>


</section>





<!-- =========================
     오답노트 페이지
========================= -->


<section id="wrongPage" class="page hidden">


<h2>
📝 오답노트
</h2>


<button id="showWrong">

오답 보기

</button>


<div id="wrongArea">

</div>



<button id="clearWrong">

오답 삭제

</button>


<br><br>


<button id="backupBtn">

백업하기

</button>


<input 
type="file"
id="restoreInput">


<br><br>


<button id="resetBtn">

전체 초기화

</button>



</section>






<!-- 목표 설정 -->

<dialog id="goalDialog">


<h3>
오늘 목표 단어 수
</h3>


<input 
id="goalInput"
type="number"
min="1"
max="800">


<br><br>


<button id="saveGoal">

저장

</button>


<button id="cancelGoal">

취소

</button>


</dialog>







<script src="data.js"></script>

<script src="script.js"></script>



<script>


if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("sw.js")

.then(()=>{

console.log(
"PWA Service Worker 등록 완료"
);

});

});

}


</script>



</body>

</html>
