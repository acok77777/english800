<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>초등 필수 영단어 800</title>

<meta name="theme-color" content="#B7EACB">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- 링크 공유 -->
<meta property="og:title" content="초등 필수 영단어 800">
<meta property="og:image" content="images/title.png">
<meta property="og:type" content="website">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 제목 -->
    <header class="header">

        <img src="images/title.png"
             class="title-image"
             alt="cat">

        <h1>초등 필수 영단어 800</h1>

    </header>

    <!-- 검색 -->
    <section class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="🔍 단어 검색">

    </section>

    <!-- A~Z -->
    <section class="alphabet">

        <button class="alpha active" data-letter="all">전체</button>

        <button class="alpha">A</button>
        <button class="alpha">B</button>
        <button class="alpha">C</button>
        <button class="alpha">D</button>
        <button class="alpha">E</button>
        <button class="alpha">F</button>
        <button class="alpha">G</button>
        <button class="alpha">H</button>
        <button class="alpha">I</button>
        <button class="alpha">J</button>
        <button class="alpha">K</button>
        <button class="alpha">L</button>
        <button class="alpha">M</button>
        <button class="alpha">N</button>
        <button class="alpha">O</button>
        <button class="alpha">P</button>
        <button class="alpha">Q</button>
        <button class="alpha">R</button>
        <button class="alpha">S</button>
        <button class="alpha">T</button>
        <button class="alpha">U</button>
        <button class="alpha">V</button>
        <button class="alpha">W</button>
        <button class="alpha">X</button>
        <button class="alpha">Y</button>
        <button class="alpha">Z</button>

    </section>

    <!-- 기능 -->
    <section class="menu">

        <button id="favoriteBtn">⭐ 즐겨찾기</button>

        <button id="wrongBtn">❌ 틀린 단어</button>

        <button id="checkedBtn">✅ 체크한 단어</button>

        <button id="quizBtn">🎲 랜덤 퀴즈</button>

        <button id="todayBtn">📅 오늘의 20단어</button>

    </section>

    <!-- 학습현황 -->
    <section class="progress-card">

        <h2>학습 현황</h2>

        <div id="progressText">

            0 / 800

        </div>

        <div class="progress">

            <div id="progressBar"></div>

        </div>

        <p id="percent">

            0%

        </p>

    </section>

    <!-- 단어목록 -->
    <section id="wordList">

    </section>

    <!-- 퀴즈 -->
    <section id="quizSection" class="hidden">

        <h2>📝 퀴즈</h2>

        <button>① 영어 → 뜻</button>

        <button>② 뜻 → 영어</button>

        <button>③ 발음 듣기</button>

        <button>④ 철자 쓰기</button>

    </section>

    <!-- 달력 -->
    <section class="calendar">

        <h2>📅 학습 달력</h2>

        <div id="calendar"></div>

    </section>

    <!-- 설정 -->
    <section class="setting">

        <h2>⚙ 설정</h2>

        <button id="darkMode">

            🌙 다크모드

        </button>

        <label>

            발음 속도

            <input
                type="range"
                min="0.5"
                max="1.5"
                step="0.1"
                value="1"
                id="speechRate">

        </label>

        <label>

            발음

            <select id="voiceType">

                <option value="en-US">🇺🇸 미국식</option>

                <option value="en-GB">🇬🇧 영국식</option>

            </select>

        </label>

    </section>

    <!-- 백업 -->
    <section class="backup">

        <h2>💾 백업</h2>

        <button id="backupBtn">

            JSON 백업

        </button>

        <button id="restoreBtn">

            JSON 복원

        </button>

        <input
            type="file"
            id="restoreFile"
            hidden>

    </section>

    <!-- 라이선스 -->
    <section class="license">

        <h2>🔐 라이선스</h2>

        <input
            id="licenseKey"
            placeholder="라이선스 키 입력">

        <button id="licenseBtn">

            인증하기

        </button>

    </section>

</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
