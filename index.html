<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>초등 필수 영단어 800</title>

    <meta name="theme-color"
          content="#A8E6CF">

    <meta name="description"
          content="초등 필수 영단어 800">

    <link rel="manifest"
          href="manifest.json">

    <link rel="icon"
          href="icons/icon-192.png">

    <link rel="apple-touch-icon"
          href="icons/icon-192.png">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<!-- ===================================
     라이선스 화면
=================================== -->

<div id="licenseScreen"
     class="screen">

    <div class="licenseCard">

        <img
            src="icons/title.png"
            id="titleImage"
            alt="cat">

        <h1>

            초등 필수 영단어 800

        </h1>

        <p>

            최초 1회 라이선스 키를 입력하세요.

        </p>

        <input

            id="licenseInput"

            type="text"

            placeholder="EN800-XXXX-XXXX"

            autocomplete="off"

            spellcheck="false"

        >

        <button

            id="licenseButton">

            라이선스 인증

        </button>

        <p id="licenseMessage"></p>

    </div>

</div>


<!-- ===================================
     메인화면
=================================== -->

<div id="app"

     class="hidden">

<header>

    <img

        src="icons/title.png"

        class="titleLogo"

        alt="cat">

    <h1>

        초등 필수 영단어 800

    </h1>

</header>


<!-- 진행률 -->

<section class="progressSection">

    <div id="progressText">

        0 / 800

    </div>

    <div class="progressBar">

        <div id="progressFill"></div>

    </div>

</section>


<!-- 검색 -->

<section class="searchSection">

    <input

        id="searchInput"

        type="text"

        placeholder="영단어 또는 뜻 검색">

</section>


<!-- 메뉴버튼 -->

<section class="menuButtons">

    <button id="btnAll">

        전체

    </button>

    <button id="btnMemorized">

        외운 단어

    </button>

    <button id="btnUnmemorized">

        안 외운 단어

    </button>

    <button id="btnQuiz">

        퀴즈

    </button>

    <button id="btnWrong">

        오답노트

    </button>

    <button id="btnBackup">

        백업

    </button>

</section>


<!-- 알파벳 -->

<section

    id="alphabetBar"

    class="alphabetBar">

</section>


<!-- 단어목록 -->

<section

    id="wordContainer">

</section>
<!-- ===================================
     단어 테이블
=================================== -->

<div class="tableWrapper">

<table id="wordTable">

<thead>

<tr>

<th>✔</th>

<th>No</th>

<th>영단어</th>

<th>🔊</th>

<th>한글발음</th>

<th>뜻</th>

</tr>

</thead>

<tbody id="wordTableBody">

<!-- render.js에서 생성 -->

</tbody>

</table>

</div>



<!-- ===================================
     퀴즈 화면
=================================== -->

<section

id="quizScreen"

class="hidden">

<h2>

퀴즈

</h2>

<div id="quizProgress">

1 / 10

</div>

<div id="quizQuestion">

문제

</div>

<div id="quizChoices">

</div>

<input

id="typingAnswer"

class="hidden"

type="text"

placeholder="영어를 입력하세요">

<button

id="typingSubmit"

class="hidden">

정답 확인

</button>

<button

id="nextQuiz">

다음 문제

</button>

</section>



<!-- ===================================
     오답노트
=================================== -->

<section

id="wrongScreen"

class="hidden">

<h2>

오답노트

</h2>

<div id="wrongList">

</div>

</section>



<!-- ===================================
     백업
=================================== -->

<section

id="backupScreen"

class="hidden">

<h2>

백업

</h2>

<button id="backupBtn">

백업 저장

</button>

<button id="restoreBtn">

복원하기

</button>

<input

type="file"

id="restoreFile"

accept=".json"

hidden>

</section>



<!-- ===================================
     정답 O/X
=================================== -->

<div

id="resultEffect"

class="hidden">

<span id="resultText">

O

</span>

</div>



<!-- ===================================
     폭죽
=================================== -->

<div

id="fireworks"

class="effectLayer">

</div>



<!-- ===================================
     비 효과
=================================== -->

<div

id="rainEffect"

class="effectLayer">

</div>



<!-- ===================================
     로딩
=================================== -->

<div

id="loading"

class="hidden">

불러오는 중...

</div>
<!-- ===================================
     하단 메뉴
=================================== -->

<footer>

    <button id="homeBtn">

        📖 단어

    </button>

    <button id="quizMenuBtn">

        🎮 퀴즈

    </button>

    <button id="progressBtn">

        📊 진행률

    </button>

    <button id="backupMenuBtn">

        💾 백업

    </button>

</footer>



<!-- ===================================
     JavaScript
=================================== -->

<script src="data.js"></script>

<script src="storage.js"></script>

<script src="license.js"></script>

<script src="progress.js"></script>

<script src="speech.js"></script>

<script src="render.js"></script>

<script src="search.js"></script>

<script src="quiz.js"></script>

<script src="backup.js"></script>

<script src="effects.js"></script>

<script src="script.js"></script>



<!-- ===================================
     PWA
=================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("sw.js");

    });

}

</script>



</body>

</html>
