<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>초등 필수 영단어 800</title>

<meta name="theme-color" content="#B7EACB">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta property="og:title" content="초등 필수 영단어 800">
<meta property="og:image" content="images/title.png">
<meta property="og:type" content="website">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header>

<div class="title-wrap">

<img
src="images/title.png"
class="title-image"
alt="title">

<div>

<h1>초등 필수 영단어 800</h1>

<p class="sub-title">
매일 20단어씩 즐겁게 공부해요 📚
</p>

</div>

</div>

</header>


<!-- 검색 -->

<section class="search-section">

<input
type="text"
id="searchInput"
placeholder="🔍 영어 또는 뜻 검색">

</section>



<!-- 알파벳 -->

<section class="alphabet-section">

<div id="alphabetButtons">

<button class="alpha active" data-letter="all">전체</button>

<button class="alpha">A</button>
<button class="alpha">B</button>
<button class="alpha">C</button>
<button class="alpha">D</button>
<button class="alpha">E</button>
<button class="alpha">F</button>
<button class="alpha">G</button>
<button class="alpha">H</button>
<button class="alpha">I</button>
<button class="alpha">J</button>
<button class="alpha">K</button>
<button class="alpha">L</button>
<button class="alpha">M</button>
<button class="alpha">N</button>
<button class="alpha">O</button>
<button class="alpha">P</button>
<button class="alpha">Q</button>
<button class="alpha">R</button>
<button class="alpha">S</button>
<button class="alpha">T</button>
<button class="alpha">U</button>
<button class="alpha">V</button>
<button class="alpha">W</button>
<button class="alpha">X</button>
<button class="alpha">Y</button>
<button class="alpha">Z</button>

</div>

</section>



<!-- 기능 -->

<section class="top-menu">

<button id="favoriteBtn">⭐ 즐겨찾기</button>

<button id="wrongBtn">❌ 틀린 단어</button>

<button id="checkedBtn">✅ 체크한 단어</button>

<button id="randomQuizBtn">🎲 랜덤 퀴즈</button>

<button id="todayBtn">📅 오늘의 20단어</button>

</section>



<!-- 학습현황 -->

<section class="progress-card">

<h2>학습 현황</h2>

<div class="progress-info">

<span id="studyCount">

0 / 800

</span>

<span id="studyPercent">

0%

</span>

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

<div class="progress-detail">

<div>

외운 단어

<strong id="learnedCount">

0

</strong>

</div>

<div>

남은 단어

<strong id="remainCount">

800

</strong>

</div>

</div>

</section>



<!-- 단어목록 -->

<section id="wordList">

</section>



<!-- 퀴즈 -->

<section id="quizSection" class="hidden">

<h2>

📝 퀴즈

</h2>

<div class="quiz-menu">

<button data-mode="eng">
① 영어 → 뜻
</button>

<button data-mode="kor">
② 뜻 → 영어
</button>

<button data-mode="listen">
③ 발음 듣기
</button>

<button data-mode="spell">
④ 철자 쓰기
</button>

</div>

<div id="quizArea">

</div>

</section>



<!-- 달력 -->

<section class="calendar-card">

<h2>

📅 학습 달력

</h2>

<div id="calendar">

</div>

</section>



<!-- 설정 -->

<section class="setting-card">

<h2>

⚙ 설정

</h2>

<button id="darkModeBtn">

🌙 다크모드

</button>

<label>

발음 속도

<input
type="range"
id="speechRate"
min="0.5"
max="1.5"
step="0.1"
value="1">

</label>

<label>

발음

<select id="voiceType">

<option value="en-US">

🇺🇸 미국식

</option>

<option value="en-GB">

🇬🇧 영국식

</option>

</select>

</label>

</section>



<!-- 백업 -->

<section class="backup-card">

<h2>

💾 백업

</h2>

<button id="backupBtn">

JSON 백업

</button>

<button id="restoreBtn">

JSON 복원

</button>

<input
type="file"
id="restoreFile"
hidden>

</section>



<!-- 라이선스 -->

<section class="license-card">

<h2>

🔐 라이선스

</h2>

<input
type="text"
id="licenseInput"
placeholder="라이선스 키 입력">

<button id="licenseBtn">

인증하기

</button>

</section>

</div>



<!-- DATA -->

<script src="data.js"></script>

<!-- MODULE -->

<script src="js/storage.js"></script>

<script src="js/search.js"></script>

<script src="js/render.js"></script>

<script src="js/speech.js"></script>

<script src="js/progress.js"></script>

<script src="js/calendar.js"></script>

<script src="js/backup.js"></script>

<script src="js/license.js"></script>

<script src="js/quiz.js"></script>

<!-- MAIN -->

<script src="script.js"></script>

</body>

</html>
