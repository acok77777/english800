<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>초등 필수 영단어 800</title>


<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="top-header">


<div class="title-area">


<img src="icons/title.png">


<h1>
📚 초등 필수 영단어 800
</h1>


</div>





<!-- 오늘 목표 / 달성률 -->


<div class="goal-box">


<div class="goal-card">


<div>

🎯 오늘 목표 단어

</div>


<input

id="todayGoalInput"

type="number"

placeholder="입력">


<div>

( <span id="todayGoalText"></span> ) 개

</div>


</div>





<div class="goal-card">


<div>

📊 달성률

</div>


<strong id="achievement">

0 / 800

</strong>


</div>


</div>







<!-- 검색 -->


<div class="search-area">


<input

id="searchInput"

placeholder="영어 / 뜻 / 발음 검색">



<button id="searchBtn">

검색

</button>


</div>



</header>









<!-- 메뉴 -->


<nav class="main-menu">


<button onclick="openTab('wordPage')">

📖 단어

</button>


<button onclick="openTab('quizPage')">

🎮 퀴즈

</button>


<button onclick="openTab('wrongPage')">

📝 오답노트

</button>


<button onclick="backupData()">

💾 백업

</button>


</nav>









<!-- ===================
단어 화면
=================== -->


<section

id="wordPage"

class="content-page">



<div class="alphabet-area">


<button id="allBtn">

전체

</button>



<button class="alphabet-btn" data-letter="A">A</button>
<button class="alphabet-btn" data-letter="B">B</button>
<button class="alphabet-btn" data-letter="C">C</button>
<button class="alphabet-btn" data-letter="D">D</button>
<button class="alphabet-btn" data-letter="E">E</button>
<button class="alphabet-btn" data-letter="F">F</button>
<button class="alphabet-btn" data-letter="G">G</button>
<button class="alphabet-btn" data-letter="H">H</button>
<button class="alphabet-btn" data-letter="I">I</button>
<button class="alphabet-btn" data-letter="J">J</button>
<button class="alphabet-btn" data-letter="K">K</button>
<button class="alphabet-btn" data-letter="L">L</button>
<button class="alphabet-btn" data-letter="M">M</button>
<button class="alphabet-btn" data-letter="N">N</button>
<button class="alphabet-btn" data-letter="O">O</button>
<button class="alphabet-btn" data-letter="P">P</button>
<button class="alphabet-btn" data-letter="Q">Q</button>
<button class="alphabet-btn" data-letter="R">R</button>
<button class="alphabet-btn" data-letter="S">S</button>
<button class="alphabet-btn" data-letter="T">T</button>
<button class="alphabet-btn" data-letter="U">U</button>
<button class="alphabet-btn" data-letter="V">V</button>
<button class="alphabet-btn" data-letter="W">W</button>
<button class="alphabet-btn" data-letter="X">X</button>
<button class="alphabet-btn" data-letter="Y">Y</button>
<button class="alphabet-btn" data-letter="Z">Z</button>


</div>






<div class="word-header">


<div>체크</div>

<div>번호</div>

<div>단어</div>

<div>발음</div>

<div>🔊</div>

<div>뜻</div>


</div>


<div id="wordList">

</div>


<div id="pagination">

</div>


</section>
<!-- ===================
퀴즈 선택 화면
=================== -->


<section

id="quizPage"

class="content-page"

style="display:none;">



<h2>

🎮 퀴즈

</h2>



<p>

체크 완료한 단어만 출제됩니다.

</p>




<button onclick="startQuiz('meaning')">

영어 → 뜻

</button>




<button onclick="startQuiz('alphabet')">

첫 알파벳

</button>




<button onclick="startQuiz('listen')">

듣기

</button>




<button onclick="startQuiz('spell')">

철자 쓰기

</button>



</section>









<!-- ===================
퀴즈 문제 화면
=================== -->


<section

id="quizPlayPage"

class="content-page"

style="display:none;">



<button

onclick="exitQuiz()">

← 퀴즈 나가기

</button>




<div id="quizPlayBox">


</div>



</section>









<!-- ===================
오답노트
=================== -->


<section

id="wrongPage"

class="content-page"

style="display:none;">



<h2>

📝 오답노트

</h2>



<div id="wrongList">


</div>



</section>









<!-- ===================
백업 / 복원
=================== -->


<section

id="backupPage"

class="content-page"

style="display:none;">



<h2>

💾 데이터 관리

</h2>



<button onclick="backupData()">

백업하기

</button>




<button onclick="restoreData()">

복원하기

</button>



</section>









<!-- ===================
스크립트 연결
=================== -->


<script src="data.js"></script>


<script src="license.js"></script>


<script src="storage.js"></script>


<script src="speech.js"></script>


<script src="effects.js"></script>


<script src="render.js"></script>


<script src="search.js"></script>


<script src="quiz.js"></script>


<script src="progress.js"></script>


<script src="backup.js"></script>


<script src="script.js"></script>





<script>


if("serviceWorker" in navigator){


navigator.serviceWorker.register(

"sw.js"

);


}


</script>



</body>

</html>
