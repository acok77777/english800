<!DOCTYPE html>
<html lang="ko">

<head>

<body>



<!-- ==========================

========================== -->


<section id="homePage" class="page">



<div class="app-title">


<img src="icons/title.png"
class="title-image"
alt="고양이">


<h1>
📚 초등 필수 영단어 800
</h1>

<div class="status-area">



<div class="status-card">

<input
id="todayGoalInput"
type="number">


<span>
개
</span>


</div>


</div>







<div class="status-card"
onclick="openHistory()">

<strong id="achievement">

0 / 800

</strong>


</div>



</div>








<div class="home-buttons">


<button onclick="openTab('wordPage')">

<br>

단어 외우기


</button>





<button onclick="openTab('quizPage')">


🎮

<br>

퀴즈


</button>


</div>







<button class="backup-button"

onclick="openTab('backupPage')">


💾 백업


</button>





</section>

========================== -->

class="page"

style="display:none;">

onclick="openTab('homePage')">

</button>







<h2>

id="searchInput"

<div class="alphabet-area">

<div class="word-header">


<span>

<span>

</span>


<span>

<div id="wordList"></div>


<div id="pagination"></div>





</section>
<!-- ==========================
     퀴즈 메인 화면
========================== -->


<section id="quizPage"

class="page"

style="display:none;">



<button class="close-btn"

onclick="openTab('homePage')">


✕ 나가기


</button>







<h2>

* 퀴즈 *

</h2>







<div class="status-area">



<div class="status-card">


📚 오늘의 퀴즈


<div>


800단어중


<br>


(<span id="quizCheckedCount">

0

</span>)개


</div>



</div>








<div class="status-card"

onclick="openQuizHistory()">



📊


<br>


누적기록 클릭



</div>





</div>









<button class="quiz-menu-button"

onclick="startQuiz('meaning')">


1️⃣ 단어의 뜻 맞추기


</button>









<button class="quiz-menu-button"

onclick="startQuiz('spell')">


2️⃣ 단어의 스펠링 맞추기


</button>





</section>









<!-- ==========================
     퀴즈 진행 화면
========================== -->


<section id="quizPlayPage"

class="page"

style="display:none;">



<button class="close-btn"

onclick="exitQuiz()">


✕ 나가기


</button>







<h2 id="quizTitle">

영어 뜻 맞추기

</h2>








<div class="status-area">

0

</span>)개

</span>

0

</span>


</div>






<div>

<br>


<span id="quizScore">

0

</span>점


</div>




</div>









<div id="quizPlayBox"></div>








<button class="quiz-menu-button"

onclick="restartQuiz()">

</button>





</section>

========================== -->

class="page"

style="display:none;">

onclick="openTab('quizPage')">

</button>







<h2>

</h2>

========================== -->
