<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>초등 필수 영단어 800</title>


<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">


</head>


<body>



<!-- ==========================
     메인 화면
========================== -->


<section id="homePage" class="page">



<div class="app-title">


<img

src="icons/title.png"

class="title-image"

alt="고양이">


<h1>

📚 초등 필수 영단어 800

</h1>


</div>








<div class="status-area">


<div class="status-card">


🎯 오늘 목표단어


<div class="goal-input-row">


<input

id="todayGoalInput"

type="number">


<span>

개

</span>


</div>


</div>







<div

class="status-card"

onclick="openHistory()">



📊 달성률


<strong id="achievement">

0 / 800

</strong>



</div>



</div>








<div

id="historyBox"

style="display:none;">



</div>









<div class="home-buttons">


<button

onclick="openTab('wordPage')">


📖

<br>

단어 외우기


</button>





<button

onclick="openTab('quizPage')">


🎮

<br>

퀴즈


</button>



</div>







<button

class="backup-button"

onclick="openTab('backupPage')">


💾 백업


</button>






</section>













<!-- ==========================
     단어 외우기
========================== -->


<section

id="wordPage"

class="page"

style="display:none;">



<button

class="close-btn"

onclick="openTab('homePage')">


✕ 나가기


</button>





<h2>

📖 단어 외우기

</h2>





<div class="search-area">


<input

id="searchInput"

placeholder="영어 / 뜻 / 발음 검색">


<button

id="searchBtn">

검색

</button>



</div>









<div class="alphabet-area">


<button id="allBtn">

전체

</button>


<button data-letter="A">A</button>

<button data-letter="B">B</button>

<button data-letter="C">C</button>

<button data-letter="D">D</button>

<button data-letter="E">E</button>

<button data-letter="F">F</button>

<button data-letter="G">G</button>

<button data-letter="H">H</button>


<button data-letter="I">I</button>

<button data-letter="J">J</button>

<button data-letter="K">K</button>

<button data-letter="L">L</button>

<button data-letter="M">M</button>

<button data-letter="N">N</button>

<button data-letter="O">O</button>

<button data-letter="P">P</button>


<button data-letter="Q">Q</button>

<button data-letter="R">R</button>

<button data-letter="S">S</button>

<button data-letter="T">T</button>

<button data-letter="U">U</button>

<button data-letter="V">V</button>

<button data-letter="W">W</button>

<button data-letter="X">X</button>

<button data-letter="Y">Y</button>

<button data-letter="Z">Z</button>



</div>








<div class="word-header">


<span>체크</span>

<span>번호</span>

<span>단어</span>

<span>발음</span>

<span>🔊</span>

<span>뜻</span>


</div>






<div id="wordList"></div>


<div id="pagination"></div>





</section>
<!-- ==========================
     퀴즈 선택 화면
========================== -->


<section

id="quizPage"

class="page"

style="display:none;">



<button

class="close-btn"

onclick="openTab('homePage')">


✕ 나가기


</button>





<h2>

🎮 퀴즈

</h2>







<div class="status-area">



<div class="status-card">


🎯 오늘 목표단어


<div>

<span id="quizGoalText"></span>

개

</div>



</div>







<div class="status-card">


📊 달성률


<strong id="quizAchievement">

0 / 800

</strong>


</div>



</div>










<button

class="quiz-menu-button"

onclick="startQuiz('meaning')">


1️⃣ 뜻 쏙쏙 찾기


</button>






<button

class="quiz-menu-button"

onclick="startQuiz('alphabet')">


2️⃣ 알파벳 쏙쏙 고르기


</button>







<button

class="quiz-menu-button"

onclick="startQuiz('spell')">


3️⃣ 스펠링 쏙쏙 쓰기


</button>








<button

class="quiz-menu-button"

onclick="openTab('wrongPage')">


📝 오답노트


</button>







</section>













<!-- ==========================
     퀴즈 문제 화면
========================== -->


<section

id="quizPlayPage"

class="page"

style="display:none;">



<button

class="close-btn"

onclick="exitQuiz()">



✕ 나가기



</button>






<h2 id="quizTitle">


퀴즈


</h2>







<div class="quiz-info">



<div>


퀴즈

<br>

<span id="quizNumber">

1

</span>

문제


</div>






<div>


점수

<br>

<span id="quizScore">

0

</span>

점


</div>



</div>








<div id="quizPlayBox">


</div>





</section>













<!-- ==========================
     오답노트
========================== -->


<section

id="wrongPage"

class="page"

style="display:none;">



<button

class="close-btn"

onclick="openTab('homePage')">


✕ 나가기


</button>







<h2>


📝 오답노트


</h2>







<div id="wrongList">


</div>







</section>













<!-- ==========================
     백업 화면
========================== -->


<section

id="backupPage"

class="page"

style="display:none;">



<button

class="close-btn"

onclick="openTab('homePage')">


✕ 나가기


</button>







<h2>


💾 백업


</h2>






<button

class="quiz-menu-button"

onclick="backupData()">



백업 저장


</button>








<button

class="quiz-menu-button"

onclick="restoreData()">



복원하기


</button>





</section>













<!-- ==========================
     학습 기록 화면
========================== -->


<section

id="historyPage"

class="page"

style="display:none;">



<button

class="close-btn"

onclick="openTab('homePage')">


✕ 나가기


</button>






<h2>


📊 학습 기록


</h2>





<div id="historyList">


</div>




</section>













<!-- ==========================
     JAVASCRIPT 연결
========================== -->


<script src="data.js"></script>


<script src="license.js"></script>


<script src="storage.js"></script>


<script src="speech.js"></script>


<script src="effects.js"></script>


<script src="render.js"></script>


<script src="search.js"></script>


<script src="quiz.js"></script>


<script src="progress.js"></script>


<script src="backup.js"></script>


<script src="script.js"></script>


<script src="history.js"></script>






<script>


if("serviceWorker" in navigator){


navigator.serviceWorker.register(

"sw.js"

);


}


</script>




</body>


</html>
